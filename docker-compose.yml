services:
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_DB: e_wallet_system
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d e_wallet_system"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/e_wallet_system?sslmode=disable
    ports:
      - "8080:8080"

volumes:
  postgres_data:
